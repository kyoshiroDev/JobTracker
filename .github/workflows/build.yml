name: JobTracker

on:
  push:
    branches: [refactor/ui-redesign-v2] # dès qu’on push sur main
  pull_request: # toutes les PR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22' # mettre la version utilisée en local

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint
        env:
          NX_CLOUD: false

      - name: Format
        run: pnpm run format

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
