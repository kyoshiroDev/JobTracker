name: JobTracker

on:
  push:
    branches: [main, refactor/ui-redesign-v2] # dès qu’on push sur main
  pull_request: # toutes les PR

env:
  NX_CLOUD: false
  NX_NO_CLOUD: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format --write

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: npx nx build frontend

