
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Type de version (major|minor|patch|prerelease)'
        required: false
        default: 'patch'
  push:
    tags:
      - 'v*.*.*'

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
  PACKAGE_MANAGER: ${{ vars.PACKAGE_MANAGER || 'npm' }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          if [ "${{ env.PACKAGE_MANAGER }}" = "pnpm" ]; then
            npm i -g pnpm
            pnpm i --frozen-lockfile
          elif [ "${{ env.PACKAGE_MANAGER }}" = "yarn" ]; then
            corepack enable
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Configure npm auth
        if: env.NPM_TOKEN != ''
        run: |
          npm config set //registry.npmjs.org/:_authToken=${NPM_TOKEN}

      - name: Version (si déclenché manuellement)
        if: github.event_name == 'workflow_dispatch'
        run: npx nx release version --specifier=${{ inputs.bump }} --yes

      - name: Changelog
        run: npx nx release changelog

      - name: Publish (toutes les libs publishable)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx nx release publish --yes
