name: CI

on:
  push:
    branches: [ refactor/ui-redesign-v2 ]
  pull_request:
    branches: [ refactor/ui-redesign-v2 ]
  workflow_dispatch: {}

permissions:
  contents: read

# Annule les jobs obsolètes si tu repushes sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  setup-and-test:
    name: Install & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # IMPORTANT : génère Prisma avant les tests si le backend utilise @prisma/client
      - name: Prisma generate
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      - name: Run unit tests (Vitest)
        run: npm run test

      - name: Upload test results (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: |
            coverage
            junit.xml
          if-no-files-found: ignore

  build-frontend:
    name: Build Frontend (Nx Angular)
    runs-on: ubuntu-latest
    needs: setup-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend app
        run: npm run build:frontend

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-frontend
          path: dist/apps/frontend

  build-backend:
    name: Build Backend (Nx NestJS)
    runs-on: ubuntu-latest
    needs: setup-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # IMPORTANT : re-génère Prisma dans ce job avant le build
      - name: Prisma generate
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      - name: Build backend app
        run: npm run build:backend

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-backend
          path: dist/apps/backend

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [ build-frontend, build-backend ]
    steps:
      - name: Report
        run:  |
          echo "CI pipeline finished. Artifacts: dist-frontend, dist-backend"
