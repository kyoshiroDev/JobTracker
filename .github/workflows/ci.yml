
name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
  PACKAGE_MANAGER: ${{ vars.PACKAGE_MANAGER || 'npm' }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      lock-hash: ${{ steps.lock.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lockfile hash
        id: lock
        run: |
          if [ -f package-lock.json ]; then echo "hash=$(sha256sum package-lock.json | cut -d ' ' -f1)" >> $GITHUB_OUTPUT; fi
          if [ -f pnpm-lock.yaml ]; then echo "hash=$(sha256sum pnpm-lock.yaml | cut -d ' ' -f1)" >> $GITHUB_OUTPUT; fi
          if [ -f yarn.lock ]; then echo "hash=$(sha256sum yarn.lock | cut -d ' ' -f1)" >> $GITHUB_OUTPUT; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .nx/cache
          key: node-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ steps.lock.outputs.hash }}
          restore-keys: |
            node-${{ runner.os }}-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: |
          if [ "${{ env.PACKAGE_MANAGER }}" = "pnpm" ]; then
            npm i -g pnpm
            pnpm i --frozen-lockfile
          elif [ "${{ env.PACKAGE_MANAGER }}" = "yarn" ]; then
            corepack enable
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Verify Nx
        run: npx nx --version

  quality-matrix:
    name: Quality • ${{ matrix.target }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ build, test, lint ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .nx/cache
          key: node-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ needs.setup.outputs.lock-hash }}

      - name: Install dependencies
        run: |
          if [ "${{ env.PACKAGE_MANAGER }}" = "pnpm" ]; then
            npm i -g pnpm
            pnpm i --frozen-lockfile
          elif [ "${{ env.PACKAGE_MANAGER }}" = "yarn" ]; then
            corepack enable
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Reset Nx cache (local)
        run: npx nx reset

      - name: Print affected (debug)
        if: github.event_name == 'pull_request'
        run: npx nx print-affected --base=origin/${{ github.base_ref }} --head=${{ github.sha }}

      - name: Run affected targets (PR)
        if: github.event_name == 'pull_request'
        run: npx nx affected --target=${{ matrix.target }} --base=origin/${{ github.base_ref }} --head=${{ github.sha }} --parallel

      - name: Run all targets (push main)
        if: github.event_name == 'push'
        run: npx nx run-many --target=${{ matrix.target }} --all --parallel
