[build]
  # Commande de build
  command = "pnpm install && nx build frontend"

  # Dossier de publication (output du build Angular)
  publish = "dist/apps/frontend/browser"

  # Dossier de base pour les commandes
  base = "."

[build.environment]
  # Version de Node.js
  NODE_VERSION = "20"

  # Utiliser pnpm
  NPM_FLAGS = "--prefer-offline --no-audit"

  # Désactiver Nx Cloud
  NX_CLOUD_ACCESS_TOKEN = ""
  NX_DAEMON = "false"

# Configuration pour Single Page Application (SPA)
# Redirige toutes les routes vers index.html pour le routing Angular
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache des assets statiques
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache des fichiers JS/CSS avec hash
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pas de cache pour index.html
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Configuration des variables d'environnement
# (À définir dans l'interface Netlify sous Site settings > Environment variables)
# SUPABASE_URL = "votre_url"
# SUPABASE_KEY = "votre_key"
