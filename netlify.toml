[build]
  command = "pnpm build"
  publish = "dist/apps/frontend/browser"

# SPA rewrite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# (Optionnel) Headers de base
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
